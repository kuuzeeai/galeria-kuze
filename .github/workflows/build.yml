name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    name: Genera keystore fija de depuracion
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Create debug keystore
        run: |
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/debug.keystore \
            -storetype JKS \
            -storepass kuze2026 -keypass kuze2026 \
            -alias galeriakuze -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Galeria Kuze, OU=Kuze, O=Kuze, L=Cali, ST=Valle, C=CO"
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: out/debug.keystore

  build:
    name: Build and upload debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -u+x | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using sdkmanager: $SDKMANAGER"

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Install Android SDK platform and build tools
        run: |
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14.3 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: galeria-kuze-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
